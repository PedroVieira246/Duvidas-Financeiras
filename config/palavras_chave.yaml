# =============================================================================
# Termos e pesos do classificador BASE por palavras-chave (F06 – RF04)
#
# VERSÃO INICIAL, escrita SEM e-mails reais. Deve ser revisada assim que a
# Anelise enviar a massa de exemplos (solicitação S01): rode
#   python scripts/avaliar_classificador.py --massa tests/dados/massa_emails.csv
# e ajuste os termos/pesos até atingir a meta de acerto.
#
# Como funciona:
#   * texto comparado sem acento e em minúsculas; o termo casa como palavra
#     ou expressão inteira;
#   * cada termo encontrado soma o seu peso (uma vez, mesmo que repita);
#     termos no ASSUNTO valem peso × peso_assunto;
#   * confiança = dominância × força
#       dominância = pontos da 1ª categoria / (pontos da 1ª + pontos da 2ª)
#       força      = min(1, pontos da 1ª / saturacao)
#   * abaixo de classificacao.limite_confianca (settings.yaml) → MANUAL.
#
# Categorias especiais (nunca respondidas, sempre encaminhadas):
#   MANUAL_SAP          → depende de consulta no SAP (fora do MVP)
#   MANUAL_FORA_ESCOPO  → assunto conhecido, mas fora do MVP (ex.: novo cadastro)
# =============================================================================

